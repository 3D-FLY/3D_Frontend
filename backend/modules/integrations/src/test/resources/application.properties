# Integrations module test config: H2 + the module's own Liquibase changelog.
# ddl-auto=validate makes every test double as a schema/entity alignment check.
spring.datasource.url=jdbc:h2:mem:integrations;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/integrations-test-master.yaml
app.public-base-url=http://localhost:8080

encryption.aes.key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

shopify.apiKey=test-api-key
shopify.apiSecret=test-api-secret
shopify.redirectUri=http://localhost:8080/oauth/callback
shopify.scopes=read_orders,read_products
