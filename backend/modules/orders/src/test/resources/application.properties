# Orders module test config: H2 + the module's own Liquibase changelog.
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/orders-test-master.yaml

