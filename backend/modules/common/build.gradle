dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    // API only — the converter implements AttributeConverter; modules that
    // actually persist bring the full JPA stack themselves. Keeping the
    // starter out prevents JPA autoconfiguration from leaking onto the
    // runtime classpath of DB-free modules (pricing).
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
