# Partners module test config: H2 + orders + partners changelogs.
spring.datasource.url=jdbc:h2:mem:partners;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/partners-test-master.yaml

encryption.aes.key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# Tests stub geocoding via MockWebServer or preset coordinates
partners.geocoding.base-url=http://localhost:1
