spring:
  application:
    name: 3dfly
  profiles:
    default: api
  datasource:
    # Local dev default: file-backed H2 so OAuth installs survive restarts.
    # Real environments override via SPRING_DATASOURCE_URL (Postgres).
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./build/dev-db;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  # Public base URL of this deployment. Shopify fetches product media from
  # here, so it must be externally reachable (ngrok in dev, ALB URL in prod).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

shopify:
  apiKey: ${SHOPIFY_API_KEY:xxx}
  apiSecret: ${SHOPIFY_API_SECRET:xxx}
  redirectUri: ${SHOPIFY_REDIRECT_URI:http://localhost:8080/oauth/callback}
  apiVersion: 2025-07
  scopes: read_products,write_products,read_inventory,write_inventory,write_files,read_publications,write_publications,read_orders

encryption:
  aes:
    # Dev-only default. Real environments MUST set AES_ENCRYPTION_KEY
    # (base64-encoded 32 bytes) — tokens at rest are encrypted with it.
    key: ${AES_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

printing:
  price:
    per-gram: 0.05
    per-minute: 0.10
  slicer:
    type: prusa
    config:
      directory: ${SLICER_CONFIG_DIR:modules/pricing/slicer-configs}
  prusa:
    slicer:
      path: ${PRUSA_SLICER_PATH:/Applications/PrusaSlicer.app/Contents/MacOS/PrusaSlicer}
  bambu:
    slicer:
      path: ${BAMBU_SLICER_PATH:/Applications/BambuStudio.app/Contents/MacOS/BambuStudio}
    printer:
      config: bambu_a1
  temp:
    directory: ${PRINTING_TEMP_DIR:/tmp/printing-calculations}
  orientation:
    enabled: true
    script:
      path: ${ORIENT_SCRIPT_PATH:modules/pricing/scripts/auto_orient_model.py}
    timeout: 60000
  pricing:
    shell-cost-factor: 0.25
    standard-layer-height: 0.2
    technology:
      FDM: 1.0
      SLS: 1.5
      SLA: 2.0
    material:
      PLA: { density: 1.24, price-per-gram: 0.05 }
      ABS: { density: 1.04, price-per-gram: 0.06 }
      PETG: { density: 1.27, price-per-gram: 0.055 }
      TPU: { density: 1.2, price-per-gram: 0.08 }
